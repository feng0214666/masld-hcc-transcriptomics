name: Three-cohort reproducibility
on:
  pull_request:
    paths:
      - 'R/**'
      - 'analysis/**'
      - 'config/**'
      - 'data/metadata/**'
      - 'tests/**'
      - 'environment/**'
      - '.github/workflows/three-cohort.yml'
  push:
    branches: [main, 'codex/masld-runnable-workflow']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: three-cohort-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  three-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download source files and record SHA-256
        shell: bash
        run: |
          mkdir -p data/raw
          tail -n +2 config/study_sources.tsv | while IFS=$'\t' read -r file url expected; do
            curl -fsSL --retry 3 --retry-max-time 180 --connect-timeout 10 --max-time 120 -o "data/raw/$file" "$url"
          done
          (cd data/raw && sha256sum *) | tee data/raw/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-checksums
          path: data/raw/checksums.txt
      - name: Install R and Bioconductor packages
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y --no-install-recommends r-base-core=4.3.3-2build2 r-bioc-deseq2=1.42.0+dfsg-1 r-bioc-limma=3.58.1+dfsg-1
      - name: Fit the three cohorts
        run: |
          Rscript --vanilla analysis/run_study.R data/raw results/three-cohort
          test -f results/three-cohort/_SUCCESS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-cohort-results
          path: results/three-cohort/
